services:
  app:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - hit-and-out-node-modules:/workspace/node_modules
    ports:
      - "5173:5173"
  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /workspace
    volumes:
      - .:/workspace
      - hit-and-out-node-modules:/workspace/node_modules

volumes:
  hit-and-out-node-modules:
